name: Android build

# Validates that the Android debug APK builds on a clean machine, independently
# of any developer laptop, and that tool/doctor_android.ps1 runs on a fresh
# Windows image without ADB on PATH.

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Install dependencies (locked)
        run: flutter pub get --enforce-lockfile

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  doctor-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      # No devices exist on the runner; the doctor reports that as a warning
      # and must still exit 0 when Flutter, Java and the SDK are correct.
      - name: Android doctor (diagnostic only)
        # Windows PowerShell 5.1, the shell team members use by default.
        shell: powershell
        run: .\tool\doctor_android.ps1
